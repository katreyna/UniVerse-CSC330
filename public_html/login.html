<!DOCTYPE html>
  <html>
  <head>
          <title>Sign Up</title>
   				<link rel="stylesheet" href="style/style.css">
    			<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"></head>
  <body>
    <nav>
      <div id="logo"><b>UniVerse</b></div>
    </nav>
    <section class="login-page">
      <div class="container">
        <h1 class="heading">Login</h1>
     <div class="forms">
   	<br>
       
    		<input type="text" placeholder="Enter Email" name="email" required>
        <br> <input type="text" placeholder="Enter Password" name="password" required>
       
       <br>
       <div class="options">
       			<input type="checkbox" id="remember">Remember me
       			<a class="login-link" id="forgot-password" href="/signup">Forgot Password?</a>
        </div>
       <br>
       <button class="sign-up" id="register">Login</button>
        </div>
        <br>
        <p id="login-reminder">Don't Have An Account?</p>
        <p><a class="login-link" href="/signup">Register</a></p>
      </div>
    </section>
	<script href="script/script.js"></script>
    </body>
</html>
