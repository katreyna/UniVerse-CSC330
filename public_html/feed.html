<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <link rel="stylesheet" href="style/feed.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <!-- Navigation -->
    <nav>
        <div id="logo"><b>UniVerse</b></div>
        <div id="nav-buttons">
            <button class="nav-link"><a href="/">Home</a></button>
            <button class="nav-link"><a href="feed.html">Feed</a></button>
            <button class="nav-link"><a href="events.html">Events</a></button>
            <button class="nav-link"><a href="/profile">My Profile</a></button>
            <button class="signout"><a href="/logout"><i class="fa fa-sign-out"></i>&nbsp;&nbsp;Sign Out</a></button>
        </div>
    </nav>

    <!-- Header Section -->
    <div class="feed-header">
        <h1>Public Feed</h1>
        <p class="subtitle">See what's happening around campus</p>
    </div>

    <!-- Feed Container -->
    <div class="container">
        <!-- Create Post Section -->
        <div class="create-post-section">
            <button id="createPostBtn" class="create-btn">
                <i class="fa fa-plus"></i> Create Post
            </button>

            <div id="createPostForm" class="create-form">
                <h2>Create a New Post</h2>
                <div id="formMessage"></div>

                <div class="form-group">
                    <label for="postTitle">Title *</label>
                    <input type="text" id="postTitle" placeholder="Enter post title" required>
                </div>

                <div class="form-group">
                    <label for="postDescription">Description *</label>
                    <textarea id="postDescription" placeholder="What's on your mind?" required></textarea>
                </div>

                <div class="form-buttons">
                    <button id="cancelPostBtn" class="cancel-btn">Cancel</button>
                    <button id="submitPostBtn" class="submit-btn">Post</button>
                </div>
            </div>
        </div>

        <div id="feed" class="card-list">
            <p class="loading">Loading posts...</p>
        </div>
    </div>

    <script src="js/feed.js"></script>
</body>
</html>
