<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <link rel="stylesheet" href="style/feed.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Animated Background -->
  <div class="bg-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <!-- Navigation -->
  <nav>
    <div id="logo"><b>UniVerse</b></div>
    <div id="nav-buttons">
      <button class="nav-link"><a href="/">Home</a></button>
      <button class="nav-link"><a href="feed.html">Feed</a></button>
      <button class="nav-link"><a href="events.html">Events</a></button>
      <button class="nav-link"><a href="/profile">My Profile</a></button>
      <button class="signout"><a href="/logout"><i class="fa fa-sign-out"></i> Sign Out</a></button>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container">
    <!-- Create Post Box -->
    <div class="create-post-box">
      <div class="create-post-trigger" id="createPostTrigger">
        <div class="user-avatar-small" id="currentUserAvatar">U</div>
        <div class="post-input-fake">What's happening?</div>
      </div>
      
      <div id="createPostForm" class="create-form">
        <div id="formMessage"></div>
        <div class="form-group">
          <textarea id="postContent" placeholder="What's happening?" autofocus></textarea>
        </div>
        <div class="form-buttons">
          <button id="cancelPostBtn" class="cancel-btn">Cancel</button>
          <button id="submitPostBtn" class="submit-btn">Post</button>
        </div>
      </div>
    </div>

    <!-- Feed -->
    <div id="feed" class="feed">
      <p class="loading">Loading posts...</p>
    </div>
  </div>

  <!-- Reply Modal -->
  <div id="replyModal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h3>Reply to post</h3>
      <div id="replyingTo" class="replying-to"></div>
      <textarea id="replyContent" placeholder="Write your reply..."></textarea>
      <button id="submitReply" class="submit-btn">Reply</button>
    </div>
  </div>

  <script src="js/feed.js"></script>
</body>
</html>
