<!DOCTYPE html>
  <html>
  <head>
        <title>Sign Up</title>
	<link rel="stylesheet" href="style/style.css">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
 </head>
  <body>
    <nav>
      <div id="logo"><b>UniVerse</b></div>
    </nav>
    <section class="signup-page">
      <div class="container">
        <h1 class="heading">Get Started For Free!</h1>
     <div class="forms">
   	<br>
       
    		<input type="text" placeholder="Enter Email" name="email" required>
       <br><br> <input type="text" placeholder="Enter Username" name="user" required>
        <br> <input type="text" placeholder="Enter Password" name="password" required>
        <br><br> <input type="text" placeholder="Confirm Password" name="user" required>
       <br>
       <button class="sign-up" id="register">Sign Up</button>
        </div>
        <br>
        <p id="login-reminder">Already have an account?</p>
        <a class="login-link" href="/login">Login</a>
      </div>
    </section>
	<script href="script/script.js"></script>
    </body>
</html>
