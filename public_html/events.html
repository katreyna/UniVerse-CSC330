<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    <link rel ="stylesheet" href="style/events.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="bg-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
	<div class="shape"></div>
    </div>

    <!-- Navigation -->
    <nav>
        <div id="logo"><b>UniVerse</b></div>
        <div id="nav-buttons">
            <button class="nav-link"><a href="/">Home</a></button>
            <button class="nav-link"><a href="feed.html">Feed</a></button>
            <button class="nav-link"><a href="events.html">Events</a></button>
            <button class="nav-link"><a href="/profile">My Profile</a></button>
            <button class="signout"><a href="/logout"><i class="fa fa-sign-out"></i>&nbsp;&nbsp;Sign Out</a></button>
        </div>
    </nav>

    <!-- Header Section -->
    <div class="events-header">
        <h1>Campus Events</h1>
        <p class="subtitle">Discover and RSVP to upcoming events</p>
    </div>

    <!-- Events Container -->
    <div class="container">
        <!-- Create Event Section -->
        <div class="create-event-section">
            <button id="createEventBtn" class="create-btn">
                <i class="fa fa-plus"></i> Create Event
            </button>

            <div id="createEventForm" class="create-form">
                <h2>Create a New Event</h2>
                <div id="formMessage"></div>

                <div class="form-group">
                    <label for="eventTitle">Event Title *</label>
                    <input type="text" id="eventTitle" placeholder="Enter event title" required>
                </div>

                <div class="form-group">
                    <label for="eventDateTime">Date & Time *</label>
                    <input type="datetime-local" id="eventDateTime" required>
                </div>

                <div class="form-group">
                    <label for="eventLocation">Location *</label>
                    <input type="text" id="eventLocation" placeholder="Enter location" required>
                </div>

                <div class="form-group">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" placeholder="Event details..."></textarea>
                </div>

                <div class="form-buttons">
                    <button id="cancelEventBtn" class="cancel-btn">Cancel</button>
                    <button id="submitEventBtn" class="submit-btn">Create Event</button>
                </div>
            </div>
        </div>

        <div id="events" class="card-list">
            <p class="loading">Loading events...</p>
        </div>
    </div>

    <script src="js/events.js"></script>
</body>
</html>
